<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Screen Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f9fafb;
            color: #374151;
            line-height: 1.5;
        }
        
        .container {
            max-width: 400px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .card {
            background: white;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2rem;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .logo-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 4rem;
            height: 4rem;
            border-radius: 50%;
            background-color: #3b82f620;
            margin-bottom: 1rem;
        }
        
        .logo-icon svg {
            width: 2rem;
            height: 2rem;
            color: #3b82f6;
        }
        
        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 0.5rem;
        }
        
        .motto {
            color: #6b7280;
            font-style: italic;
            margin-bottom: 0.5rem;
        }
        
        .system-name {
            color: #6b7280;
            margin-bottom: 0.5rem;
        }
        
        .address {
            color: #9ca3af;
            font-size: 0.875rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 0.5rem;
        }
        
        input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            font-size: 1rem;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        
        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .password-wrapper {
            position: relative;
        }
        
        .toggle-password {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            padding: 0.25rem;
        }
        
        .btn {
            width: 100%;
            padding: 0.625rem 1.25rem;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 0.375rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.15s ease-in-out;
        }
        
        .btn:hover {
            background-color: #2563eb;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .links {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e5e7eb;
            text-align: center;
        }
        
        .link {
            display: block;
            color: #3b82f6;
            text-decoration: none;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }
        
        .link:hover {
            text-decoration: underline;
        }
        
        .footer {
            margin-top: 2rem;
            text-align: center;
            color: #6b7280;
            font-size: 0.875rem;
        }
        
        .language-toggle {
            text-align: right;
            margin-bottom: 1rem;
        }
        
        .lang-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            color: #374151;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.15s ease-in-out;
        }
        
        .lang-btn:hover {
            background-color: #f9fafb;
        }
        
        .error {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 1rem;
            border-radius: 0.375rem;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }
        
        .error-icon {
            display: inline-flex;
            margin-right: 0.5rem;
        }
        
        @media (max-width: 640px) {
            .container {
                margin: 1rem auto;
            }
            
            .card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="language-toggle">
            <button class="lang-btn" id="langToggle">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
                <span id="langText">EN</span>
            </button>
        </div>
        
        <div class="logo">
            <div class="logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path>
                    <path d="M9 10h6"></path>
                    <path d="M12 7v6"></path>
                </svg>
            </div>
            <h1 id="schoolName">EduShare Academy</h1>
            <p class="motto" id="schoolMotto">"Knowledge for All"</p>
            <p class="system-name" id="systemName">School Inventory Management System</p>
            <p class="address" id="schoolAddress">123 Education Street, Nairobi, Kenya</p>
        </div>
        
        <div class="card">
            <h2 style="font-size: 1.25rem; font-weight: 600; color: #111827; margin-bottom: 1.5rem; text-align: center;">
                Sign in to your account
            </h2>
            
            <div id="errorContainer" class="error" style="display: none;">
                <svg class="error-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span id="errorMessage"></span>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                    <div id="usernameError" style="color: #dc2626; font-size: 0.875rem; margin-top: 0.25rem; display: none;"></div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" id="togglePassword">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div id="passwordError" style="color: #dc2626; font-size: 0.875rem; margin-top: 0.25rem; display: none;"></div>
                </div>
                
                <button type="submit" class="btn" id="submitBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 0.5rem;">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                    Sign in
                </button>
            </form>
            
            <div class="links">
                <a href="#" class="link" id="recoverLink">Recover access</a>
                <a href="#" class="link" id="forgotLink">Forgot your password?</a>
            </div>
        </div>
        
        <div class="footer">
            <p>Need help? Contact your system administrator.</p>
            <p>EduShare v1.0 • School Inventory Management</p>
        </div>
    </div>

    <script>
        // Mock translations
        const translations = {
            en: {
                title: "Sign in to your account",
                username: "Username",
                password: "Password",
                signIn: "Sign in",
                signingIn: "Signing in...",
                recoverAccess: "Recover access",
                forgotPassword: "Forgot your password?",
                needHelp: "Need help? Contact your system administrator.",
                systemName: "School Inventory Management System",
                version: "EduShare v1.0 • School Inventory Management",
                usernamePlaceholder: "Enter your username",
                passwordPlaceholder: "Enter your password",
                errors: {
                    invalidCredentials: "Invalid username or password",
                    usernameLength: "Username must be between 3 and 50 characters",
                    passwordLength: "Password must be at least 8 characters",
                    required: "This field is required"
                }
            },
            sw: {
                title: "Ingia kwenye akaunti yako",
                username: "Jina la mtumiaji",
                password: "Nenosiri",
                signIn: "Ingia",
                signingIn: "Inaanza kuingia...",
                recoverAccess: "Rudisha upatikanaji",
                forgotPassword: "Umesahau nenosiri?",
                needHelp: "Unahitaji usaidizi? Wasiliana na msimamizi wa mfumo wako.",
                systemName: "Mfumo wa Usimamizi wa Mali ya Shule",
                version: "EduShare v1.0 • Usimamizi wa Mali ya Shule",
                usernamePlaceholder: "Weka jina la mtumiaji",
                passwordPlaceholder: "Weka nenosiri",
                errors: {
                    invalidCredentials: "Jina la mtumiaji au nenosiri si sahihi",
                    usernameLength: "Jina la mtumiaji lazima liwe kati ya herufi 3 na 50",
                    passwordLength: "Nenosiri lazima liwe angalau herufi 8",
                    required: "Sehemu hii inahitajika"
                }
            }
        };

        let currentLang = 'en';
        
        // DOM elements
        const langToggle = document.getElementById('langToggle');
        const langText = document.getElementById('langText');
        const schoolName = document.getElementById('schoolName');
        const schoolMotto = document.getElementById('schoolMotto');
        const systemName = document.getElementById('systemName');
        const schoolAddress = document.getElementById('schoolAddress');
        const loginTitle = document.querySelector('.card h2');
        const usernameLabel = document.querySelector('label[for="username"]');
        const passwordLabel = document.querySelector('label[for="password"]');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const recoverLink = document.getElementById('recoverLink');
        const forgotLink = document.getElementById('forgotLink');
        const needHelp = document.querySelector('.footer p:first-child');
        const version = document.querySelector('.footer p:last-child');
        const errorContainer = document.getElementById('errorContainer');
        const errorMessage = document.getElementById('errorMessage');
        const usernameError = document.getElementById('usernameError');
        const passwordError = document.getElementById('passwordError');
        const togglePassword = document.getElementById('togglePassword');
        const loginForm = document.getElementById('loginForm');

        // Update UI with translations
        function updateUI() {
            const t = translations[currentLang];
            
            // Update text content
            loginTitle.textContent = t.title;
            usernameLabel.textContent = t.username;
            passwordLabel.textContent = t.password;
            usernameInput.placeholder = t.usernamePlaceholder;
            passwordInput.placeholder = t.passwordPlaceholder;
            submitBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 0.5rem;">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                <polyline points="10 17 15 12 10 7"></polyline>
                <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>${t.signIn}`;
            recoverLink.textContent = t.recoverAccess;
            forgotLink.textContent = t.forgotPassword;
            needHelp.textContent = t.needHelp;
            version.textContent = t.version;
            systemName.textContent = t.systemName;
            
            // Update language toggle text
            langText.textContent = currentLang === 'en' ? 'EN' : 'SW';
        }

        // Toggle language
        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'sw' : 'en';
            updateUI();
        });

        // Toggle password visibility
        let passwordVisible = false;
        togglePassword.addEventListener('click', () => {
            passwordVisible = !passwordVisible;
            passwordInput.type = passwordVisible ? 'text' : 'password';
            
            // Update icon
            togglePassword.innerHTML = passwordVisible ? 
                `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="
